[package]
name = "crazyopoly"
version = "0.1.0"
edition = "2021"
description = "Crazyopoly: a deluxe, top-down Monopoly-like board game with bots"
license = "MIT"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
rapier3d = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
