[package]
name = "crazypoly"
version = "0.1.0"
edition = "2021"
description = "A faithful top-down recreation of the classic Monopoly board game"
license = "MIT"

[dependencies]
macroquad = "0.4"
rapier3d = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = true
